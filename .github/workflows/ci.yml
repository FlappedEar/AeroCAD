# SPDX-License-Identifier: GPL-3.0-or-later
#
# Fast gate for every pull request and push to main: does it compile (warnings are
# errors) and do the unit tests pass, on Linux (distribution packages) and macOS Apple
# Silicon (Homebrew). No packaging and no GUI tests; the app smoke test
# (ctest -L gui) and the OpenFOAM run (ctest -L openfoam) are for local runs.
name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".clang-format"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".clang-format"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests only; every main commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache \
            qt6-base-dev qt6-declarative-dev qt6-quick3d-dev qt6-shadertools-dev libxkbcommon-dev \
            qml6-module-qtquick qml6-module-quick3d qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript qml6-module-qtcore \
            libocct-data-exchange-dev libocct-modeling-algorithms-dev libocct-foundation-dev \
            libocct-modeling-data-dev libocct-ocaf-dev libocct-visualization-dev libtbb-dev fonts-dejavu-core \
            nlohmann-json3-dev libpugixml-dev catch2 libgl1-mesa-dri
      - uses: ./.github/actions/ccache
        with:
          key: linux
      - name: Configure
        run: cmake --preset release -DAEROCAD_WARNINGS_AS_ERRORS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Unit tests
        run: ctest --test-dir build/release --output-on-failure -LE "gui|openfoam" --parallel 4
      - name: ccache stats
        if: always()
        run: ccache --show-stats

  macos:
    name: macOS Apple Silicon (Homebrew)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ninja ccache qt opencascade nlohmann-json pugixml catch2
      - uses: ./.github/actions/ccache
        with:
          key: macos
      - name: Configure
        run: >
          cmake --preset release -DAEROCAD_WARNINGS_AS_ERRORS=ON
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Unit tests
        run: ctest --test-dir build/release --output-on-failure -LE "gui|openfoam" --parallel 4
      - name: ccache stats
        if: always()
        run: ccache --show-stats
